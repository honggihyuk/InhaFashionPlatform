<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= typeof title !== 'undefined' && title !== 'InhaFashion' ? title + ' · InhaFashion' : 'InhaFashion' %></title>
  <meta name="csrf-token" content="<%= csrfToken %>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Adamina&family=Noto+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <% (typeof styles !== 'undefined' ? styles : ['shop']).forEach(function (s) { %>
  <link rel="stylesheet" href="/css/<%= s %>.css">
  <% }) %>
</head>
