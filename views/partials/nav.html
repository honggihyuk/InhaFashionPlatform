<header class="nav">
  <div class="container nav-inner">
    <a class="wordmark" href="/">InhaFashion <span class="mono">H&amp;M EDITION</span></a>
    <nav class="nav-links" aria-label="주요 메뉴">
      <a href="/products?index=Ladieswear" class="<%= path === '/products' && locals.filters && filters.index === 'Ladieswear' ? 'is-active' : '' %>">여성</a>
      <a href="/products?index=Menswear" class="<%= path === '/products' && locals.filters && filters.index === 'Menswear' ? 'is-active' : '' %>">남성</a>
      <a href="/products?index=Divided" class="<%= path === '/products' && locals.filters && filters.index === 'Divided' ? 'is-active' : '' %>">디바이디드</a>
      <a href="/products?index=Baby%2FChildren" class="<%= path === '/products' && locals.filters && filters.index === 'Baby/Children' ? 'is-active' : '' %>">아동</a>
      <a href="/products?index=Sport" class="<%= path === '/products' && locals.filters && filters.index === 'Sport' ? 'is-active' : '' %>">스포츠</a>
      <a href="/products?sort=new">신상품</a>
      <a href="/products?sale=1" class="nav-sale <%= path === '/products' && locals.filters && filters.sale ? 'is-active' : '' %>">SALE</a>
    </nav>
    <div class="nav-right">
      <form class="nav-search" action="/products" role="search">
        <label class="sr-only" for="nav-q">상품 검색</label>
        <input id="nav-q" name="q" placeholder="상품명, 품목, 상품번호 검색" value="<%= locals.filters ? filters.q : '' %>">
      </form>
      <% if (auth && auth.role === 'user') { %>
        <a href="/orders">주문내역</a>
        <a href="/cart">장바구니<span class="cart-badge"><%= cartCount %></span></a>
        <form action="/logout" method="post">
          <input type="hidden" name="_csrf" value="<%= csrfToken %>">
          <button class="linklike" type="submit"><%= auth.name %>님 · 로그아웃</button>
        </form>
      <% } else { %>
        <a href="/login">로그인</a>
        <a class="btn btn-primary btn-sm" href="/signup">회원가입</a>
      <% } %>
    </div>
  </div>
</header>
<% if (flash) { %>
<div class="container"><div class="flash flash-<%= flash.type %>" role="status"><%= flash.text %></div></div>
<% } %>
